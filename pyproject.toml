[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-api"
dynamic = ["version"]
requires-python = ">=3.14"
description = "API for sudoku related logic"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "blm34", email = "pypi.escalate394@passmail.net"},
]
keywords = ["sudoku"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "sudoku-strategy>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/blm34/sudoku-api/"
Repository = "https://github.com/blm34/sudoku-api/"
Issues = "https://github.com/blm34/sudoku-api/issues"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "ty>=0.0.78",
]
tests = [
    "pytest>=9.1.1",
]
